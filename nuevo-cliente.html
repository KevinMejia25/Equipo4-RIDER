<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>RIDER · Nuevo Cliente</title>

  <link
    rel="stylesheet"
    href="/estilos/ui.css"
  >

</head>

<body>

  <!-- BARRA SUPERIOR -->
  <header class="barra">

    <h1 class="barra__titulo">
      RIDER
    </h1>

    <div class="barra__acciones">

      <span
        class="pequeno tenue"
        style="margin-right: var(--e-3)"
      >
        Coordinador
      </span>

      <a
        class="btn btn--pequeno btn--secundario"
        href="login.html"
      >
        Salir
      </a>

    </div>

  </header>


  <!-- PESTAÑAS -->
  <nav class="pestanas" role="tablist">

    <a
      class="pestana"
      role="tab"
      aria-selected="false"
      href="index.html"
    >
      Inicio
    </a>

    <a
      class="pestana"
      role="tab"
      aria-selected="false"
      href="inventario.html"
    >
      Inventario
    </a>

    <a
      class="pestana"
      role="tab"
      aria-selected="false"
      href="eventos.html"
    >
      Eventos
    </a>

    <a
      class="pestana"
      role="tab"
      aria-selected="true"
      href="clientes.html"
    >
      Clientes
    </a>

    <a
      class="pestana"
      role="tab"
      aria-selected="false"
      href="cuadrilla.html"
    >
      Cuadrilla
    </a>

  </nav>


  <!-- CONTENIDO -->
  <main
    class="contenedor"
    style="padding-top: var(--e-5); padding-bottom: var(--e-6)"
  >

    <div class="encabezado">

      <div>

        <h2>
          Nuevo Cliente
        </h2>

        <p class="pequeno tenue">
          Registra la información del cliente.
        </p>

      </div>

      <a
        class="btn btn--secundario"
        href="clientes.html"
      >
        Volver
      </a>

    </div>


    <!-- MENSAJE -->
    <div
      class="aviso aviso--exito oculto"
      id="mensaje-exito"
      role="status"
    >
      Cliente registrado correctamente.
    </div>


    <!-- ERROR -->
    <div
      class="aviso aviso--error oculto"
      id="mensaje-error"
      role="alert"
    >
      No se pudo registrar el cliente.
    </div>


    <!-- FORMULARIO -->
    <section class="tarjeta">

      <form
        class="formulario"
        id="formulario-cliente"
      >


        <!-- NOMBRE / CONTACTO -->
        <div class="formulario__fila">

          <div class="campo">

            <label
              class="campo__etiqueta"
              for="nombre"
            >
              Nombre
              <span
                class="requerido"
                aria-hidden="true"
              >
                *
              </span>
            </label>

            <input
              class="campo__control"
              type="text"
              id="nombre"
              name="nombre"
              maxlength="150"
              required
              autocomplete="organization"
            >

          </div>


          <div class="campo">

            <label
              class="campo__etiqueta"
              for="contacto"
            >
              Contacto
            </label>

            <input
              class="campo__control"
              type="text"
              id="contacto"
              name="contacto"
              maxlength="150"
              autocomplete="name"
            >

          </div>

        </div>


        <!-- TELÉFONO / CORREO -->
        <div class="formulario__fila">

          <div class="campo">

            <label
              class="campo__etiqueta"
              for="telefono"
            >
              Teléfono
            </label>

            <input
              class="campo__control"
              type="tel"
              id="telefono"
              name="telefono"
              maxlength="30"
              autocomplete="tel"
            >

          </div>


          <div class="campo">

            <label
              class="campo__etiqueta"
              for="correo"
            >
              Correo
            </label>

            <input
              class="campo__control"
              type="email"
              id="correo"
              name="correo"
              maxlength="150"
              autocomplete="email"
            >

          </div>

        </div>


        <!-- NOTAS -->
        <div class="campo">

          <label
            class="campo__etiqueta"
            for="notas"
          >
            Notas
          </label>

          <textarea
            class="campo__control"
            id="notas"
            name="notas"
            rows="5"
            maxlength="500"
          ></textarea>

        </div>


        <!-- BOTONES -->
        <div class="fila">

          <a
            href="clientes.html"
            class="btn btn--secundario"
          >
            Cancelar
          </a>

          <button
            type="submit"
            class="btn"
            id="btn-guardar"
          >
            Guardar cliente
          </button>

        </div>

      </form>

    </section>

  </main>


  <script
    type="module"
    src="/nuevo-cliente.js"
  ></script>

</body>

</html>
